[project]
name = "filmoscopie"
version = "0.1.0"
description = "This movie looks like something I already watch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wiki-dump-reader @ git+https://github.com/athoune/wiki-dump-reader.git@753b1c3cb809f7ac84cbf24a59187a480c2bcca1",
    "qdrant-client>=1.16.2",
    "sentence-transformers>=5.2",
    "tiktoken>=0.12.0",
    "zstandard>=0.25.0",
    "ultralytics>=8.4.14",
    "webvtt-py>=0.5.1",
    "scikit-learn>=1.8.0",
    "faiss-cpu>=1.13.2",
    "sentencepiece>=0.2.1",
]

[project.optional-dependencies]

vision = [
    "fastembed>=0.7.4",
    "yt-dlp>=2026.2.4",
    "youtube-search>=2.2.0",
    "scenedetect[pyav]>=0.6.7.1",

]

jupyter = [
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.9",
]

[tool.uv]
no-binary-package = ["av"]#, "opencv-python"]

#[build-system]
#requires = ["uv_build >= 0.10.0, <0.11.0"]
#build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]
jupyter = [
    "jupyterlab>=4.5.9",
]
